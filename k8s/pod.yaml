apiVersion: v1
kind: Pod
metadata:
  name: safebank-app
  namespace: safebank-will
  labels:
    app: safebank-app
spec:
  containers:
  - name: nginx
    image: nginx:1.29.8-alpine
    ports:
    - containerPort: 80
    readinessProbe:
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /healthz
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: site
      mountPath: /usr/share/nginx/html/index.html
      subPath: index.html
      readOnly: true
    - name: site
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf
      readOnly: true
  volumes:
  - name: site
    configMap:
      name: safebank-site
