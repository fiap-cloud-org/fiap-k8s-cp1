apiVersion: apps/v1
kind: Deployment
metadata:
  name: safebank-app
  namespace: safebank-will
  labels:
    app: safebank-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safebank-app
  template:
    metadata:
      labels:
        app: safebank-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.29.8-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        - name: site
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
      volumes:
      - name: site
        configMap:
          name: safebank-site
